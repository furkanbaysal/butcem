<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Aile Finans Yöneticisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<base target="_blank">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <!-- Üst Başlık -->
    <header class="bg-slate-900 dark:bg-slate-800 text-white p-4 sticky top-0 z-20 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-wallet text-emerald-400"></i> Bütçem</h1>
                <p class="text-xs text-slate-400">Aile Finans Takibi</p>
            </div>
            <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center hover:bg-slate-700 transition">
                <i id="darkModeIcon" class="fa-solid fa-moon text-yellow-400"></i>
            </button>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-md mx-auto p-4 pb-24">
        
        <!-- Ay Seçici -->
        <div class="flex flex-col gap-2 pb-4 mb-2" id="monthTabs">
            <!-- Aylar JS ile eklenecek -->
        </div>

        <!-- Özet Kartı -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 mb-6 relative overflow-hidden fade-in">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full -mr-10 -mt-10"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-blue-500/10 rounded-full -ml-10 -mb-10"></div>
            
            <p class="text-sm text-slate-500 dark:text-slate-400 font-medium mb-1" id="currentMonthTitle">Ağustos 2025</p>
            
            <div class="mb-4">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Kalan Nakit Para</p>
                <h2 class="text-4xl font-extrabold tracking-tight" id="netBalance">₺0</h2>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl">
                    <div class="flex items-center gap-2 text-emerald-500 mb-1">
                        <i class="fa-solid fa-arrow-trend-up"></i>
                        <span class="text-xs font-semibold">GELİR</span>
                    </div>
                    <p class="text-lg font-bold text-slate-700 dark:text-slate-200" id="totalIncome">₺0</p>
                </div>
                <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl">
                    <div class="flex items-center gap-2 text-rose-500 mb-1">
                        <i class="fa-solid fa-arrow-trend-down"></i>
                        <span class="text-xs font-semibold">GİDER</span>
                    </div>
                    <p class="text-lg font-bold text-slate-700 dark:text-slate-200" id="totalExpense">₺0</p>
                </div>
            </div>

            <!-- Harcama Çubuğu -->
            <div class="mt-6">
                <div class="flex justify-between text-xs mb-1">
                    <span>Harcama Oranı</span>
                    <span id="expensePercent">0%</span>
                </div>
                <div class="w-full bg-slate-200 dark:bg-slate-600 rounded-full h-2.5">
                    <div id="expenseBar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- İşlem Butonları -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="openModal('income')" class="bg-emerald-500 hover:bg-emerald-600 text-white p-4 rounded-2xl shadow-lg shadow-emerald-500/30 flex flex-col items-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-plus text-xl"></i>
                <span class="font-semibold text-sm">Gelir Ekle/Güncelle</span>
            </button>
            <button onclick="openModal('expense')" class="bg-rose-500 hover:bg-rose-600 text-white p-4 rounded-2xl shadow-lg shadow-rose-500/30 flex flex-col items-center gap-2 transition active:scale-95">
                <i class="fa-solid fa-minus text-xl"></i>
                <span class="font-semibold text-sm">Yeni Gider Ekle</span>
            </button>
        </div>

        <!-- Gider Listesi -->
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg">Gider Detayları</h3>
            <span class="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded-md" id="itemCount">0 Kalem</span>
        </div>

        <div id="expensesList" class="space-y-3">
            <!-- Giderler JS ile eklenecek -->
        </div>

    </main>

    <!-- Alt Navigasyon (Mobil) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 safe-area-bottom z-20">
        <div class="max-w-md mx-auto grid grid-cols-4 items-center p-3">
            <button class="flex flex-col items-center text-emerald-500" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Ana Sayfa</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300" onclick="openModal('income')">
                <i class="fa-solid fa-plus-circle text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Gelir</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300" onclick="openModal('expense')">
                <i class="fa-solid fa-minus-circle text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Gider</span>
            </button>
            <button class="flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300" onclick="openYearModal()">
                <i class="fa-solid fa-calendar-plus text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Yıl / Ay</span>
            </button>
        </div>
    </nav>

    <!-- Modal (Ekleme/Düzenleme Penceresi) -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center fade-in">
        <div class="bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 pb-8 sm:pb-6 shadow-2xl transform transition-transform duration-300 translate-y-full sm:translate-y-0" id="modalContent">
            
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-bold">Yeni Gider</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div id="inputNameGroup">
                    <label class="block text-sm font-medium mb-1 text-slate-600 dark:text-slate-300">Açıklama / Banka Adı</label>
                    <input type="text" id="inputName" placeholder="Örn: Denizbank Kredi" class="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-slate-600 dark:text-slate-300">Tutar (₺)</label>
                    <input type="number" id="inputAmount" placeholder="0" class="w-full p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none text-lg font-bold">
                </div>

                <button onclick="saveItem()" class="w-full bg-slate-900 dark:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-slate-800 dark:hover:bg-emerald-700 transition active:scale-95 mt-2">
                    Kaydet
                </button>
            </div>
        </div>
    </div>

    <!-- Yıl / Ay Yönetim Penceresi -->
    <div id="yearModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center fade-in">
        <div class="bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 pb-8 sm:pb-6 shadow-2xl transform transition-transform duration-300 translate-y-full sm:translate-y-0" id="yearModalContent">

            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Yıl ve Ay Yönetimi</h3>
                <button onclick="closeYearModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Yıla Git -->
            <div class="bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl p-4 mb-4">
                <p class="text-sm font-semibold mb-3 flex items-center gap-2 text-slate-700 dark:text-slate-200"><i class="fa-solid fa-arrow-right-to-bracket text-emerald-500"></i> Yıla Git</p>
                <div class="flex gap-2">
                    <select id="jumpYearSelect" class="flex-1 p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none text-sm"></select>
                    <button onclick="jumpToYear()" class="px-5 bg-slate-900 dark:bg-emerald-600 text-white text-sm font-bold rounded-xl hover:bg-slate-800 dark:hover:bg-emerald-700 transition active:scale-95">Git</button>
                </div>
            </div>

            <!-- Yeni Yıl/Ay Ekle -->
            <div class="bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-2xl p-4">
                <p class="text-sm font-semibold mb-3 flex items-center gap-2 text-slate-700 dark:text-slate-200"><i class="fa-solid fa-calendar-plus text-blue-500"></i> Yeni Yıl / Ay Ekle</p>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div>
                        <label class="block text-xs font-medium mb-1 text-slate-500 dark:text-slate-400">Yıl</label>
                        <input type="number" id="newYearInput" placeholder="2031" class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1 text-slate-500 dark:text-slate-400">Ay</label>
                        <select id="newMonthSelect" class="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none text-sm"></select>
                    </div>
                </div>
                <button onclick="addCustomMonth()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition active:scale-95">
                    <i class="fa-solid fa-plus mr-1"></i> Dönem Ekle
                </button>
                <p class="text-[11px] text-slate-400 mt-2">Var olan dönemi eklerseniz o aya yönlendirilirsiniz; mevcut verileriniz hiçbir zaman silinmez.</p>
            </div>

        </div>
    </div>

    <script>
        // --- VERİ YÖNETİMİ ---
        
        // Excel'den alınan başlangıç verileri + 2027 uzatması
        const defaultData = [
            { month: "Ağustos", year: 2025, income: 180000, expenses: [
                { name: "Denizbank", amount: 8300 }, { name: "Akbank", amount: 5000 }, { name: "TEB", amount: 7600 },
                { name: "Halkbank", amount: 4000 }, { name: "İş Bankası", amount: 20000 }, { name: "İş Bankası Kredi", amount: 29000 },
                { name: "QNB", amount: 20000 }, { name: "Denizbank Ek Hesap", amount: 3000 }, { name: "Kira", amount: 23000 },
                { name: "Araba + Fatura", amount: 20000 }
            ]},
            { month: "Eylül", year: 2025, income: 176000, expenses: [
                { name: "Denizbank", amount: 8300 }, { name: "Akbank", amount: 5000 }, { name: "TEB", amount: 7600 },
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 20000 }, { name: "QNB Kredi", amount: 14000 },
                { name: "Birevim", amount: 38000 }, { name: "İş Bankası Kredi", amount: 29000 }, { name: "QNB", amount: 20000 },
                { name: "Denizbank Ek Hesap", amount: 3000 }, { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 }
            ]},
            { month: "Ekim", year: 2025, income: 180000, expenses: [
                { name: "Garanti Ek Hesap", amount: 10000 }, { name: "Garanti", amount: 8300 }, { name: "TEB", amount: 7600 },
                { name: "Halkbank", amount: 5000 }, { name: "İş Bankası", amount: 15000 }, { name: "QNB Kredi", amount: 14000 },
                { name: "Birevim", amount: 38000 }, { name: "İş Bankası Kredi", amount: 29000 }, { name: "QNB", amount: 15000 },
                { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Kasım", year: 2025, income: 180000, expenses: [
                { name: "Garanti", amount: 8333 }, { name: "Halkbank", amount: 3000 }, { name: "İş Bankası", amount: 13000 },
                { name: "QNB Kredi", amount: 14000 }, { name: "QNB Yeni Kredi Kartı", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 5110 },
                { name: "Birevim", amount: 45000 }, { name: "QNB Kredi Kartı", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 },
                { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 15000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Aralık", year: 2025, income: 180000, expenses: [
                { name: "Garanti", amount: 8333 }, { name: "Halkbank", amount: 3000 }, { name: "İş Bankası", amount: 10000 },
                { name: "QNB Yeni Kredi Kartı", amount: 8510 }, { name: "QNB Yeni Kredi", amount: 5110 }, { name: "QNB Yeni 1,99", amount: 7040 },
                { name: "Birevim", amount: 51000 }, { name: "QNB", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 },
                { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Ocak", year: 2026, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "QNB Yeni Kredi Kartı", amount: 8510 },
                { name: "QNB Yeni Kredi", amount: 5110 }, { name: "QNB Yeni 1,99", amount: 7040 }, { name: "Birevim", amount: 80000 },
                { name: "QNB", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 }, { name: "Kira", amount: 23000 },
                { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Şubat", year: 2026, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 5110 },
                { name: "QNB Yeni 1,99", amount: 7040 }, { name: "Birevim", amount: 80000 }, { name: "QNB", amount: 10000 },
                { name: "QNB Yeni Kredi", amount: 9890 }, { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 },
                { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Mart", year: 2026, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 5110 },
                { name: "Birevim", amount: 80000 }, { name: "QNB", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 },
                { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Nisan", year: 2026, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 5110 },
                { name: "Birevim", amount: 80000 }, { name: "QNB", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 },
                { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Mayıs", year: 2026, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "Birevim", amount: 80000 },
                { name: "QNB", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 }, { name: "Kira", amount: 23000 },
                { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Haziran", year: 2026, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "Birevim", amount: 80000 },
                { name: "QNB", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 }, { name: "Kira", amount: 23000 },
                { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            { month: "Temmuz", year: 2026, income: 220000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "Birevim", amount: 80000 },
                { name: "QNB", amount: 10000 }, { name: "QNB Yeni Kredi", amount: 9890 }, { name: "Kira", amount: 23000 },
                { name: "Araba + Fatura", amount: 20000 }, { name: "Garanti Kredi Kartı", amount: 2300 }
            ]},
            // 2027 AYLARI EKLENDİ
            { month: "Ocak", year: 2027, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "Birevim", amount: 80000 },
                { name: "QNB", amount: 10000 }, { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 }
            ]},
            { month: "Şubat", year: 2027, income: 200000, expenses: [
                { name: "Halkbank", amount: 1000 }, { name: "İş Bankası", amount: 10000 }, { name: "Birevim", amount: 80000 },
                { name: "QNB", amount: 10000 }, { name: "Kira", amount: 23000 }, { name: "Araba + Fatura", amount: 20000 }
            ]}
        ];

        // LocalStorage'dan veriyi al veya varsayılanı kullan
        let financeData = JSON.parse(localStorage.getItem('financeData')) || defaultData;

        // --- EKSİK AYLARI TAMAMLAMA (2025 Ağustos - 2030 Aralık) ---
        const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
        const allYears = [2025, 2026, 2027, 2028, 2029, 2030];

        function ensureAllMonths() {
            allYears.forEach(y => {
                // 2025 verisi Ağustos'ta başlıyor; diğer yıllar Ocak'tan başlar
                const startIdx = (y === 2025) ? 7 : 0;
                for (let i = startIdx; i < 12; i++) {
                    const exists = financeData.some(d => d.year === y && d.month === monthNames[i]);
                    if (!exists) {
                        // Veri girilmemiş ay: boş (0 TL) başlar
                        financeData.push({ month: monthNames[i], year: y, income: 0, expenses: [] });
                    }
                }
            });
            // Kronolojik sırala: önce yıl, sonra ay
            financeData.sort((a, b) => a.year - b.year || monthNames.indexOf(a.month) - monthNames.indexOf(b.month));
        }
        ensureAllMonths();
        
        // SON AÇILAN AYI HATIRLAMA
        let currentMonthIndex = parseInt(localStorage.getItem('lastViewedMonth')) || 0;
        
        // Eğer kayıtlı index veri uzunluğundan büyükse (eski kayıt), sıfırla
        if (currentMonthIndex >= financeData.length) {
            currentMonthIndex = 0;
        }
        
        let editingIndex = null;

        // --- FONKSİYONLAR ---

        function saveData() {
            localStorage.setItem('financeData', JSON.stringify(financeData));
            // Son bakılan ayı kaydet
            localStorage.setItem('lastViewedMonth', currentMonthIndex);
            renderApp();
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY', maximumFractionDigits: 0 }).format(amount);
        }

        function renderApp() {
            const currentData = financeData[currentMonthIndex];
            const totalExp = currentData.expenses.reduce((sum, item) => sum + item.amount, 0);
            const net = currentData.income - totalExp;
            const percent = currentData.income > 0 ? Math.min(Math.round((totalExp / currentData.income) * 100), 100) : 0;

            // Başlıkları Güncelle
            document.getElementById('currentMonthTitle').innerText = `${currentData.month} ${currentData.year}`;
            document.getElementById('totalIncome').innerText = formatCurrency(currentData.income);
            document.getElementById('totalExpense').innerText = formatCurrency(totalExp);
            document.getElementById('netBalance').innerText = formatCurrency(net);
            document.getElementById('expensePercent').innerText = `%${percent}`;
            
            // Renkleri Ayarla
            const bar = document.getElementById('expenseBar');
            const netText = document.getElementById('netBalance');
            if (net < 0) {
                netText.className = "text-4xl font-extrabold tracking-tight text-rose-500";
                bar.className = "bg-rose-500 h-2.5 rounded-full transition-all duration-500";
            } else {
                netText.className = "text-4xl font-extrabold tracking-tight text-emerald-500";
                bar.className = "bg-emerald-500 h-2.5 rounded-full transition-all duration-500";
            }
            bar.style.width = `${percent}%`;

            // Ay Sekmelerini Oluştur (yıl başlıkları altında gruplu)
            const tabsContainer = document.getElementById('monthTabs');
            tabsContainer.innerHTML = '';
            let currentRow = null;
            let lastYear = null;
            financeData.forEach((data, index) => {
                // Yıl değişince yeni satır + yıl başlığı ekle
                if (data.year !== lastYear) {
                    lastYear = data.year;
                    currentRow = document.createElement('div');
                    currentRow.className = 'flex items-center gap-2 overflow-x-auto hide-scrollbar';
                    tabsContainer.appendChild(currentRow);

                    const yearLabel = document.createElement('div');
                    yearLabel.className = 'shrink-0 sticky left-0 z-10 px-3 py-2 rounded-full text-sm font-bold bg-slate-300 dark:bg-slate-600 text-slate-700 dark:text-slate-200 shadow-sm';
                    yearLabel.innerText = data.year;
                    currentRow.appendChild(yearLabel);
                }
                const isActive = index === currentMonthIndex;
                const btn = document.createElement('button');
                btn.className = `shrink-0 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition ${isActive ? 'bg-slate-900 text-white dark:bg-emerald-600 shadow-md' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700'}`;
                btn.innerText = data.month;
                btn.onclick = () => { 
                    currentMonthIndex = index; 
                    saveData(); // Ay değişimini kaydet
                };
                currentRow.appendChild(btn);
            });

            // Gider Listesini Oluştur
            const list = document.getElementById('expensesList');
            list.innerHTML = '';
            document.getElementById('itemCount').innerText = `${currentData.expenses.length} Kalem`;

            if (currentData.expenses.length === 0) {
                list.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-receipt text-3xl mb-2"></i><p>Bu ay için gider bulunamadı.</p></div>';
            }

            currentData.expenses.forEach((exp, idx) => {
                const div = document.createElement('div');
                div.className = "bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-center fade-in";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-900/30 flex items-center justify-center text-rose-500">
                            <i class="fa-solid fa-credit-card"></i>
                        </div>
                        <div>
                            <p class="font-semibold text-slate-800 dark:text-slate-200">${exp.name}</p>
                            <p class="text-xs text-slate-500">Gider Kalemi</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-slate-700 dark:text-slate-300">${formatCurrency(exp.amount)}</span>
                        <div class="flex gap-1">
                            <button onclick="editExpense(${idx})" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 hover:text-blue-500 flex items-center justify-center transition">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteExpense(${idx})" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 hover:text-rose-500 flex items-center justify-center transition">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- MODAL İŞLEMLERİ ---
        let modalMode = 'expense';

        function openModal(mode, index = null) {
            modalMode = mode;
            editingIndex = index;
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const title = document.getElementById('modalTitle');
            const nameGroup = document.getElementById('inputNameGroup');
            const nameInput = document.getElementById('inputName');
            const amountInput = document.getElementById('inputAmount');

            modal.classList.replace('hidden', 'flex');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);

            if (mode === 'income') {
                title.innerText = "Geliri Güncelle";
                nameGroup.style.display = 'none';
                amountInput.value = financeData[currentMonthIndex].income;
            } else {
                nameGroup.style.display = 'block';
                if (index !== null) {
                    title.innerText = "Gideri Düzenle";
                    nameInput.value = financeData[currentMonthIndex].expenses[index].name;
                    amountInput.value = financeData[currentMonthIndex].expenses[index].amount;
                } else {
                    title.innerText = "Yeni Gider Ekle";
                    nameInput.value = '';
                    amountInput.value = '';
                }
            }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.replace('flex', 'hidden'), 300);
        }

        function saveItem() {
            const amount = parseFloat(document.getElementById('inputAmount').value);
            if (isNaN(amount) || amount < 0) {
                alert("Lütfen geçerli bir tutar girin.");
                return;
            }

            if (modalMode === 'income') {
                financeData[currentMonthIndex].income = amount;
            } else {
                const name = document.getElementById('inputName').value.trim() || "İsimsiz Gider";
                if (editingIndex !== null) {
                    financeData[currentMonthIndex].expenses[editingIndex] = { name, amount };
                } else {
                    financeData[currentMonthIndex].expenses.push({ name, amount });
                }
            }

            saveData();
            closeModal();
        }

        function editExpense(index) {
            openModal('expense', index);
        }

        function deleteExpense(index) {
            if (confirm("Bu gider kalemini silmek istediğinize emin misiniz?")) {
                financeData[currentMonthIndex].expenses.splice(index, 1);
                saveData();
            }
        }

        // --- YIL / AY YÖNETİMİ ---

        // Modalı açarken yıl listesini ve ay seçeneklerini doldur
        function openYearModal() {
            const modal = document.getElementById('yearModal');
            const content = document.getElementById('yearModalContent');
            modal.classList.replace('hidden', 'flex');
            setTimeout(() => content.classList.remove('translate-y-full'), 10);

            // Mevcut yılları benzersiz olarak listele
            const years = [...new Set(financeData.map(d => d.year))].sort((a, b) => a - b);
            const jumpSelect = document.getElementById('jumpYearSelect');
            jumpSelect.innerHTML = '';
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = y + ' yılına git';
                jumpSelect.appendChild(opt);
            });

            // Ay seçeneklerini doldur
            const monthSelect = document.getElementById('newMonthSelect');
            monthSelect.innerHTML = '';
            monthNames.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                monthSelect.appendChild(opt);
            });

            // Yıl alanını, mevcut en büyük yıldan bir sonrasıyla öner
            const maxYear = Math.max(...years);
            const yearInput = document.getElementById('newYearInput');
            if (!yearInput.value) yearInput.placeholder = (maxYear + 1).toString();
        }

        function closeYearModal() {
            const modal = document.getElementById('yearModal');
            const content = document.getElementById('yearModalContent');
            content.classList.add('translate-y-full');
            setTimeout(() => modal.classList.replace('flex', 'hidden'), 300);
        }

        // Seçilen yılın ilk ayına git
        function jumpToYear() {
            const y = parseInt(document.getElementById('jumpYearSelect').value);
            const idx = financeData.findIndex(d => d.year === y);
            if (idx !== -1) {
                currentMonthIndex = idx;
                saveData();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            closeYearModal();
        }

        // Kullanıcının girdiği yıl + ayı ekle (varsa o aya git; veri silinmez)
        function addCustomMonth() {
            const y = parseInt(document.getElementById('newYearInput').value);
            const m = document.getElementById('newMonthSelect').value;

            if (isNaN(y) || y < 2000 || y > 2100) {
                alert("Lütfen geçerli bir yıl girin (2000 - 2100 arası).");
                return;
            }

            let idx = financeData.findIndex(d => d.year === y && d.month === m);
            if (idx === -1) {
                // Yeni dönem: boş (0 TL) başlar, mevcut verilere dokunulmaz
                financeData.push({ month: m, year: y, income: 0, expenses: [] });
                financeData.sort((a, b) => a.year - b.year || monthNames.indexOf(a.month) - monthNames.indexOf(b.month));
                idx = financeData.findIndex(d => d.year === y && d.month === m);
            }

            currentMonthIndex = idx;
            saveData();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            closeYearModal();
        }

        // --- TEMA AYARLARI ---
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('darkModeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon text-yellow-400";
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-orange-400";
                localStorage.setItem('theme', 'dark');
            }
        }

        // Tema Yükleme
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('darkModeIcon').className = "fa-solid fa-sun text-orange-400";
        }

        // Uygulamayı Başlat (Son bakılan ayda açılacak)
        renderApp();
    </script>
</body>
</html>
